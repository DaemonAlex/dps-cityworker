<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>City Worker Control Room</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="dps-look.css"><!-- DPS bubble look, loaded last -->
</head>
<body>
    <div id="app" style="display: none;">
        <div class="container">
            <header>
                <h1 style="display:flex;align-items:center;gap:10px"><img src="dps-logo.svg" alt="DelPerroSands" style="height:24px;width:auto;flex:none">CITY GRID CONTROL</h1>
                <div class="status-bar">
                    <span id="updated"></span>
                    <button id="close-btn" aria-label="Close">&times;</button>
                </div>
            </header>

            <main>
                <div id="message" class="message" hidden></div>

                <h2>Grid</h2>
                <div class="grid-overview" id="sectors"></div>

                <div class="two-col">
                    <section class="sector-card panel">
                        <h2>Workers on shift <span class="count" id="worker-count"></span></h2>
                        <div id="workers" class="rows"></div>
                    </section>
                    <section class="sector-card panel">
                        <h2>Open damage reports <span class="count" id="report-count"></span></h2>
                        <div id="reports" class="rows"></div>
                    </section>
                </div>
            </main>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
